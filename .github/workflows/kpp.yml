# gorating.com: built with a pinned release of kpp (kpp-version: the installed kpp
# alone, its FreeBSD sysroot and official libraries included), tested on Windows and in a FreeBSD
# 14.3 VM against a MariaDB with the made-up data, and packed as the site's release
# (gorating-site.tar.gz, DEPLOY.md), whose install kpp's tools/deploy/test-deploy.sh checks in
# the VM. Every push to master that passes publishes the package as the GitHub Release kpp-<run>
# (kovarex, 2026-11-04: "just take the latest"), which `kpp-deploy.sh` alone installs on the server
# (kpp-deploy.sh kpp-<run> an older one). Nothing here deploys, holds a secret or connects to the site.
name: kpp

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # kpp's tools/deploy (kpp-deploy.sh and its test) at this commit, until a kpp release ships them.
  KPP_DEPLOY_COMMIT: f23622e92aa0f97d1eab1bfe5d30fead9a92643a

jobs:
  # kpp's release, the unit tests (no database), the FreeBSD program and its test program.
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: kpp
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content kpp-version -Raw).Trim()
          gh release download $version --repo kovarex/kpp --pattern "kpp-*.zip" --dir kpp-release
          if ($LASTEXITCODE -ne 0) { throw "kpp $version has no zip" }
          Expand-Archive (Get-ChildItem kpp-release\*.zip)[0].FullName kpp-release\kpp
          $exe = (Get-ChildItem -Recurse kpp-release\kpp -Filter kpp.exe)[0].FullName
          "KPP=$exe" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          & $exe --version

      - name: Tests on Windows (without a database)
        shell: powershell
        run: |
          & $env:KPP --no-server --test
          if ($LASTEXITCODE -ne 0) { throw "kpp --test: exit $LASTEXITCODE" }

      # The CSS and JS bundled, minified and named by their contents (assets/build.sh, esbuild
      # pinned); the release program links those names.
      - name: The CSS and JS
        shell: bash
        run: |
          set -e
          options=$(sh assets/build.sh freebsd/assets | tail -n 1)
          echo "$options"
          echo "SITE_ASSETS=$options" >> "$GITHUB_ENV"

      - name: The FreeBSD program and its tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $assets = $env:SITE_ASSETS -split ' '
          & $env:KPP --no-server --release --target freebsd @assets gorating
          if ($LASTEXITCODE -ne 0) { throw "kpp --release --target freebsd: exit $LASTEXITCODE" }
          $out = & $env:KPP --no-server --target freebsd --no-run --test gorating 2>&1 | ForEach-Object { "$_" }
          $out
          $tests = $out | ForEach-Object { if ($_ -match '^kppc --test: built (.*) \(not run: --no-run\)$') { $Matches[1] } } | Select-Object -First 1
          if (-not $tests -or -not (Test-Path $tests)) { throw 'no FreeBSD test program' }
          New-Item -ItemType Directory -Force freebsd | Out-Null
          Copy-Item build\release\gorating freebsd\gorating
          Copy-Item $tests freebsd\gorating-tests
          # (all of --version's output first: Select-Object -First 1 on the pipe stops kpp early, and
          # the step then ended with its non-zero exit code)
          $version = @(& $env:KPP --version)
          $version[0] | Out-File -Encoding ascii freebsd\kpp-version.txt
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd
          path: freebsd
          retention-days: 7
          if-no-files-found: error

  # The whole suite in FreeBSD 14.3, against MariaDB from pkg, then the program run as Apache runs it,
  # then the package installed by kpp-deploy.sh (test-deploy.sh) on a database made by setup.sql.
  test-freebsd:
    needs: [build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: freebsd
          path: freebsd

      - uses: actions/download-artifact@v4
        with:
          name: gorating-site
          path: package

      - name: kpp's tools/deploy
        run: |
          mkdir deploy-tools
          for f in kpp-deploy.sh test-deploy.sh; do
            curl -fsSL -o deploy-tools/$f "https://raw.githubusercontent.com/kovarex/kpp/$KPP_DEPLOY_COMMIT/tools/deploy/$f"
          done

      - name: Tests on FreeBSD 14.3 with MariaDB
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '14.3'
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y mariadb1011-server
          run: |
            set -e
            freebsd-version
            sysrc mysql_enable=YES
            service mysql-server start
            mysql -e "CREATE USER 'gorating'@'127.0.0.1' IDENTIFIED BY 'test-only'; GRANT ALL PRIVILEGES ON *.* TO 'gorating'@'127.0.0.1'"
            chmod +x freebsd/gorating freebsd/gorating-tests
            GORATING_TEST_DB=127.0.0.1:3306:gorating:test-only freebsd/gorating-tests > freebsd/tests.log 2>&1 || true
            cat freebsd/tests.log
            # The program as Apache runs it, on the database the tests left: the About page (no
            # database) and the players' list (the database).
            printf '{"database": {"host": "127.0.0.1", "port": 3306, "user": "gorating", "password": "test-only", "name": "gorating_kpp_tests"}, "resourceAddress": "", "sessionSecret": "0123456789abcdef0123456789abcdef-ci"}' > freebsd/config.json
            for page in /about /players; do
              REQUEST_METHOD=GET REQUEST_URI=$page GORATING_CONFIG=freebsd/config.json freebsd/gorating > freebsd/cgi$(echo $page | tr / _).txt 2>&1 || true
              head -c 300 freebsd/cgi$(echo $page | tr / _).txt; echo
            done
            # The package installed as on the server: a database as production's before the switch
            # (setup.sql), the migrations run by kpp-deploy.sh --migrate, its smoke tests, a rollback.
            mysql -e "CREATE DATABASE gorating_deploy CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
            mysql gorating_deploy < setup.sql
            sed 's/gorating_kpp_tests/gorating_deploy/' freebsd/config.json > freebsd/deploy-config.json
            GORATING_TEST_CONFIG=freebsd/deploy-config.json sh deploy-tools/test-deploy.sh package/gorating-site.tar.gz "mysql -h 127.0.0.1 -u gorating -ptest-only gorating_deploy" > freebsd/deploy.log 2>&1 || true
            cat freebsd/deploy.log

      - name: Result
        if: always()
        shell: bash
        run: |
          last=$(grep -E '^[0-9]+ tests?, [0-9]+ failed$' freebsd/tests.log 2>/dev/null | tail -n 1 || true)
          [ -n "$last" ] || last='no result: the tests did not finish'
          { echo '### gorating (kpp) on FreeBSD 14.3'; echo; echo "    $last"; grep -E '^failed:|check failed|test failed' freebsd/tests.log 2>/dev/null | sed 's/^/    /' || true; } >> "$GITHUB_STEP_SUMMARY"
          case "$last" in *", 0 failed") ;; *) exit 1 ;; esac
          for page in _about _players; do
            grep -q '^Status: 200' freebsd/cgi$page.txt && grep -q '</html>' freebsd/cgi$page.txt || { echo "the CGI's $page did not answer 200 with a page:"; head -c 2000 freebsd/cgi$page.txt; exit 1; }
          done
          for file in $(cd freebsd/assets && ls); do
            grep -q "/$file\"" freebsd/cgi_about.txt || { echo "the pages do not link $file, which the package holds"; exit 1; }
          done
          deployed=$(tail -n 1 freebsd/deploy.log 2>/dev/null || true)
          { echo; echo "    ${deployed:-test-deploy: no result}"; grep -E '^FAIL' freebsd/deploy.log 2>/dev/null | sed 's/^/    /' || true; } >> "$GITHUB_STEP_SUMMARY"
          [ "$deployed" = "test-deploy: ALL PASSED" ] || { echo "the package's install failed:"; cat freebsd/deploy.log; exit 1; }

  # The site's package: what DEPLOY.md puts on the server, laid out as there, with kpp-deploy.sh,
  # which installs it. test-freebsd installs it before a release is made of it.
  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: freebsd
          path: freebsd

      - name: gorating-site.tar.gz
        shell: bash
        run: |
          set -e
          # The release's name: kpp-<run number>, rising, which the server shows (kpp-deploy.sh
          # --status); BUILD.txt names the commit.
          version="kpp-$GITHUB_RUN_NUMBER"
          p=gorating-site
          mkdir -p $p/public $p/migrations
          cp freebsd/gorating $p/public/gorating.cgi && chmod 755 $p/public/gorating.cgi
          cp deploy/.htaccess freebsd/assets/site.*.css freebsd/assets/site.*.js $p/public/
          cp -R img $p/public/img
          cp migrations/*.sql $p/migrations/
          cp deploy/gorating-config.example.json deploy/switch-to-kpp.sh DEPLOY.md DEPLOY-CHECKLIST.md $p/
          curl -fsSL -o $p/kpp-deploy.sh "https://raw.githubusercontent.com/kovarex/kpp/$KPP_DEPLOY_COMMIT/tools/deploy/kpp-deploy.sh"
          {
            echo "app gorating"
            echo "version $version"
            echo "program public/gorating.cgi"
            for m in $p/migrations/*.sql; do echo "migration $(basename $m)"; done
          } > $p/MANIFEST
          {
            echo "gorating $version, commit $GITHUB_SHA"
            echo "$(cat freebsd/kpp-version.txt), installed (kpp-version)"
            echo "kpp-deploy.sh from kovarex/kpp $KPP_DEPLOY_COMMIT"
            echo "built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            (cd $p && find . -type f ! -name BUILD.txt | sort | xargs sha256sum)
          } > $p/BUILD.txt
          cat $p/MANIFEST $p/BUILD.txt
          tar -czf gorating-site.tar.gz $p
          sha256sum gorating-site.tar.gz | cut -d' ' -f1 > gorating-site.tar.gz.sha256
          cat gorating-site.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: gorating-site
          path: |
            gorating-site.tar.gz
            gorating-site.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error

  # A push to master that passed: the package as the release kpp-<run number> (its tag made here, at
  # the commit built), GitHub's latest, which kpp-deploy.sh downloads without a token. Two pushes'
  # runs can finish in either order (kpp-14 finished after kpp-15 and became the latest): one
  # release job at a time, and only the highest run number is made the latest.
  release:
    needs: [package, test-freebsd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: kpp-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gorating-site

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="kpp-$GITHUB_RUN_NUMBER"
          gh release create "$tag" gorating-site.tar.gz gorating-site.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "$tag (${GITHUB_SHA:0:10})" \
            --notes "The kpp version's site package (DEPLOY.md), commit $GITHUB_SHA, built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Install: kpp-deploy.sh (the latest) or kpp-deploy.sh $tag."
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' | sed -n 's/^kpp-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)
          if [ "$newest" = "$GITHUB_RUN_NUMBER" ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
          else
            echo "kpp-$newest is newer: $tag is not made the latest"
          fi
